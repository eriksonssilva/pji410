[project]
name = "minha-secao"
version = "0.1.0"
description = "Análise em escala da acessibilidade das seções eleitorais brasileiras (dados abertos do TSE)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[dependency-groups]
analysis = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
